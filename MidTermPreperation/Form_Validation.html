<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation - Avinandan Roy</title>
  </head>
  <body>
    <form onSubmit ="return validateForm()">
      <p>Name : <input type="text" id="name" /></p>
      <div id="nameError"></div>

      <p>Email: <input type="email" id="email" /></p>
      <div id="emailError"></div>

      <p>Password: <input type="password" id="password" /></p>
      <div id="passError"></div>

      <p>Confirm PassWord: <input type="password" id="cPassword" /></p>
      <div id="cPasswordError"></div>

      <button type="submit">Submit</button>
    </form>

    <script>
        function validateForm(){
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value ;
            let cPass = document.getElementById("cPassword").value;

            document.getElementById("nameError").innerText = "";
            document.getElementById("emailError").innerText = "";
            document.getElementById("passError").innerText = "";
            document.getElementById("cPasswordError").innerText = "";

            let validity = true ;

            if(name.length < 3){
                document.getElementById("nameError").innerText = "Name Must be at least 3 character long";
                validity = false ;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailPattern.test(email)){
                document.getElementById("emailError").innerText = "Please Enter a valid email.";
                validity = false;
            }

            if(pass.length < 6){
             document.getElementById("passError").innerText = "Password Must be at least 6 character long";
             validity = false ;               
            }

            if(pass !== cPass){
                document.getElementById("cPasswordError").innerText = "Confirm Password must match with password";
                validity = false;
            }

            return validity;
        }
    </script>
  </body>
</html>
