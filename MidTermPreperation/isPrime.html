<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Number - Avinandan Roy</title>
  </head>
  <body>
    <input type="number" id="number" /> <br />
    <button onClick="checkPrime()">Check</button>
    <p class="result"></p>

    <script>
      function isPrime(n) {
        if (n <= 1) {
          return false;
        }
        if (n === 2) {
          return true;
        }

        for (let i = 2; i <= Math.sqrt(n); i++) {
          if (n % i === 0) {
            return false;
          } else {
            return true;
          }
        }
      }

      function checkPrime() {
        const input = document.getElementById("number").value;
        let result = document.querySelector(".result");

        if (!input) {
          result.textContent = "PLZ enter a number";
        } else {
          if (isPrime(input)) {
            result.textContent = "It is Prime Number";
          } else {
            result.textContent = "It is Not Prime Number";
          }
        }
      }
    </script>
  </body>
</html>
