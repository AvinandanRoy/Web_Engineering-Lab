<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page - Avinandan Roy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1000px;
        margin: 0 auto;
      }

      .bg-image {
        background-image: url("https://studentshub.daffodilvarsity.edu.bd/assets/img/about/1719679319.jpeg");
        height: 500px;
        background-repeat: no-repeat;
        margin: 0 auto;
        background-position: center;
      }

      .service {
        margin-top: 60px;
      }

      ul {
        margin: 0 0 0 50px;
      }

      ul li a {
        color: black;
      }

      .subscribe {
        margin-top: 60px;
        margin-bottom: 60px ;
      }
      .subscribe h2 {
        text-align: center;
      }

      input{
        width: 100%;
        padding: 12px;
        font-size: 14px;
        border: none;
        border-bottom: 1px solid #aaa;
        margin-bottom: 20px;
        padding-bottom: 30px;
        margin-top: 20px;
      }

      button{
        margin: 0 auto ;
        padding:10px 460px;
        border: none ;
        background: green ;
        color: white ;
        font-size : 20px;
      }

      footer{
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="bg-image"></div>

    <div class="service">
      <h3>Student Service</h3>
      <ul>
        <li><a href="#">Registration</a></li>
        <li><a href="#">Academic Counselling</a></li>
        <li><a href="#">Research Instruction</a></li>
        <li><a href="#">Result Information</a></li>
      </ul>
    </div>

    <div class="subscribe">
      <h2>Subscribe to Our Newsletter</h2>
      <form>
        <input type="email" placeholder="Enter Your email here*" required />
        <button type="submit">Sign Up</button>
      </form>
    </div>

    <footer>
        <p>Copyright@221-15-4899</p>
    </footer>
  </body>
</html>
